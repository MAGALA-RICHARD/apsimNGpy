name: apsimNGpy Unittests Runner

on:
  push:
    branches:
      - main

  # Lets you test it manually from the GitHub Actions tab
  workflow_dispatch:

concurrency:
  group: apsimNGpy-unit-tests
  cancel-in-progress: false

jobs:
  apsimNGpy-tests:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run apsimNGpy Unit Tests
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DUE_DAY: ${{ vars.DUE_DAY }}
          LAST_DAY: ${{vars.LAST_DAY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python apsimNGpy/tests/tester_main.py

      - name: Upload reminder log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sent-reminders-${{ github.run_id }}
          path: sent_reminders.log
          if-no-files-found: ignore
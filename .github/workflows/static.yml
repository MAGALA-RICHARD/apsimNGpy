name: Build and Deploy Sphinx Documentation

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy Documentation
    runs-on: windows-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ------------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ------------------------------------------------------------
      # Upgrade packaging tools
      # ------------------------------------------------------------
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      # ------------------------------------------------------------
      # Install apsimNGpy
      # ------------------------------------------------------------
      - name: Install apsimNGpy
        run: |
          python -m pip install -e .

      # ------------------------------------------------------------
      # Install documentation dependencies
      # ------------------------------------------------------------
      - name: Install documentation dependencies
        run: |
          python -m pip install sphinx
          python -m pip install sphinx-rtd-theme
          python -m pip install sphinx-copybutton
          python -m pip install myst-parser

      # ------------------------------------------------------------
      # Show environment information
      # ------------------------------------------------------------
      - name: Show environment
        shell: pwsh
        run: |
          python --version
          python -m pip --version
          python -c "import apsimNGpy; print('apsimNGpy:', apsimNGpy.__file__)"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"

      # ------------------------------------------------------------
      # Optional: inspect APSIM binary environment
      #
      # If TEST_APSIM_BINARY is configured as a repository variable
      # or environment variable, this step shows it.
      # ------------------------------------------------------------
      - name: Check APSIM binary path
        shell: pwsh
        run: |
          if ($env:TEST_APSIM_BINARY) {
            Write-Host "TEST_APSIM_BINARY=$env:TEST_APSIM_BINARY"

            if (Test-Path $env:TEST_APSIM_BINARY) {
              Write-Host "APSIM binary directory exists."
              Get-ChildItem $env:TEST_APSIM_BINARY | Select-Object -First 20
            }
            else {
              Write-Warning "TEST_APSIM_BINARY does not exist on this runner."
            }
          }
          else {
            Write-Host "TEST_APSIM_BINARY is not explicitly configured."
          }

      # ------------------------------------------------------------
      # Generate API reference
      #
      # api_generator.py should generate doc/api.rst
      # ------------------------------------------------------------
      - name: Generate API reference
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python doc/api_generator.py

      # ------------------------------------------------------------
      # Verify API output
      # ------------------------------------------------------------
      - name: Verify generated API reference
        shell: pwsh
        run: |
          if (-not (Test-Path "doc/api.rst")) {
            throw "doc/api.rst was not generated."
          }

          Write-Host "API reference successfully generated:"
          Get-Item "doc/api.rst" |
            Select-Object Name, Length, LastWriteTime

      # ------------------------------------------------------------
      # Build Sphinx documentation
      #
      # conf.py lives in doc/
      # ------------------------------------------------------------
      - name: Build Sphinx documentation
        shell: pwsh
        run: |
          python -m sphinx `
            -b html `
            --keep-going `
            doc `
            _site

      # ------------------------------------------------------------
      # Verify HTML output
      # ------------------------------------------------------------
      - name: Verify documentation build
        shell: pwsh
        run: |
          if (-not (Test-Path "_site/index.html")) {
            throw "_site/index.html was not generated."
          }

          Write-Host "Sphinx documentation built successfully:"
          Get-Item "_site/index.html" |
            Select-Object Name, Length, LastWriteTime

      # ------------------------------------------------------------
      # Configure GitHub Pages
      # ------------------------------------------------------------
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # ------------------------------------------------------------
      # Upload generated HTML
      # ------------------------------------------------------------
      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # ------------------------------------------------------------
      # Deploy to GitHub Pages
      # ------------------------------------------------------------
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4